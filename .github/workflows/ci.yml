name: Command Center checks
on:
  push:
    branches:
      - feature/nextjs-foundation
  pull_request:
    branches:
      - main
jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preference engine tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build a standalone exported client website
        run: node scripts/smoke-client-export.mjs
