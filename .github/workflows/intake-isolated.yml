name: Isolated authenticated intake tests

on:
  push:
    branches:
      - codex/intake-auth-isolated-qa-oct14
      - codex/intake-atomic-isolated-oct14
      - integration/release-candidate-oct14
  workflow_dispatch:

# This workflow never uses account secrets, project refs, supabase link/db push,
# or production URLs. All keys and users belong to a Docker stack on this runner.
permissions:
  contents: read
concurrency:
  group: intake-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install local Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start disposable local PostgreSQL, GoTrue, PostgREST and gateway
        shell: bash
        run: |
          set -euo pipefail
          # No project link, no remote token, no remote database.
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          supabase init --force
          supabase start -x realtime,storage-api,imgproxy,mailpit,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Install isolated transaction fixture only
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          set -a
          eval "$(supabase status -o env 2>/dev/null)"
          set +a
          test "$API_URL" = "http://127.0.0.1:54321"
          test -n "$DB_URL"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          # Reviewed SQL candidate (without any deliberate fault trigger)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/atomic-staged-import-candidate.sql
          # Fault injection belongs only to the disposable CI database
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/isolated/atomic-final-stage-fault.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: Run authenticated fault, concurrency, and RLS tests
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          # Local temporary process scope only: never upload or print secrets.
          set -a
          eval "$(supabase status -o env 2>/dev/null)"
          set +a
          test "$API_URL" = "http://127.0.0.1:54321"
          test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          CC_ISOLATED_DB=YES \
          CC_TEST_SUPABASE_URL="$API_URL" \
          CC_TEST_SUPABASE_ANON_KEY="$ANON_KEY" \
          CC_TEST_SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
            node --experimental-strip-types scripts/test-intake-supabase.mjs
      - name: Install Chromium for signed-in browser QA
        run: npx playwright install --with-deps chromium
      - name: Verify real Next.js login and UI-led import
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
          set -a
          eval "$(supabase status -o env 2>/dev/null)"
          set +a
          test "$API_URL" = "http://127.0.0.1:54321"
          test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/cc-next.log" 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true' EXIT
          CC_ISOLATED_DB=YES \
          CC_TEST_SUPABASE_URL="$API_URL" \
          CC_TEST_SUPABASE_ANON_KEY="$ANON_KEY" \
          CC_TEST_SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
          CC_TEST_WEB_URL="http://127.0.0.1:3000" \
            node scripts/test-intake-ui.mjs || {
              echo 'Isolated Next.js browser QA failed; server log tail:'
              tail -n 80 "$RUNNER_TEMP/cc-next.log"
              exit 1
            }
      - name: Stop disposable stack
        if: always()
        run: supabase stop --no-backup || true
